<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>标签工作台 Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f3f7; font-family: -apple-system, sans-serif; padding: 10px; }
        
        .controls { max-width: 500px; margin: 0 auto 15px; background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .row { margin-bottom: 12px; }
        label { font-size: 12px; font-weight: bold; color: #666; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-main { padding: 14px 5px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; font-size: 13px; }

        .copyright-info { background: #FFD700; color: #333; padding: 12px; margin-top: 15px; font-size: 11px; border-radius: 8px; text-align: center; line-height: 1.5; border: 1px solid #DAA520; }

        #container { margin: 15px auto; display: flex; flex-direction: column; align-items: center; }
        
        .page-wrapper { background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 12px; overflow: hidden; position: relative; border: 0.1px solid #eee; }
        .size-100-100 { width: 100mm; height: 100mm; }
        .size-100-50 { width: 100mm; height: 50mm; }
        .size-80-80 { width: 80mm; height: 80mm; }

        .label-content { width: 100%; height: 100%; padding: 4mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .header-mode { width: 100%; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2.5px solid #000; padding-bottom: 1.5mm; }
        .big-qty { font-size: 32px; font-weight: 900; line-height: 1.1; }
        .big-tracking { font-size: 18px; font-weight: 900; font-family: monospace; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 1.5mm 0; margin: 1.5mm 0; width: 100%; text-align: center; }
        .code-area { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .barcode-img { max-width: 100%; height: auto; }
        .qrcode-img { height: 100%; width: auto; max-height: 130px; }
        .footer-made { width: 100%; border: 2px solid #000; text-align: center; font-size: 16px; font-weight: bold; padding: 1mm; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; z-index: 10000; opacity: 0; transition: 0.3s; pointer-events: none; font-size: 13px; }
        .toast.show { opacity: 1; top: 30px; }
    </style>
</head>
<body>

<div class="controls">
    <div class="row">
        <label>运输方式</label>
        <select id="mode" onchange="toggleCustomMode()">
            <option>大陆飞日本🇯🇵</option><option>香港飞日本🇯🇵</option><option>国际快递</option>
            <option>普船海运GS</option><option>普船海运包税</option><option>快船包税</option>
            <option>普船商业件</option><option>快船商业件</option><option>20呎整柜商业件</option>
            <option>40呎整柜商业件</option><option>佐川小包</option><option>EMS快递</option>
            <option>空运超大件</option> <option>海运超大件</option>
            <option>食品届</option><option>食品专线</option>
            <option>日本仓电池</option><option>日本🇯🇵回国</option>
            <option>HCN Supply Chain (Shenzhen) Co., Ltd.</option>
            <option value="CUSTOM">-- 手动输入 --</option>
        </select>
        <input type="text" id="custom-mode-input" placeholder="输入运输方式" style="display:none; margin-top:8px;">
    </div>

    <div style="display:flex; gap:10px;" class="row">
        <div style="flex:1">
            <label>纸张格式</label>
            <select id="label-size">
                <option value="size-100-100">100mm x 100mm</option>
                <option value="size-100-50">100mm x 50mm</option>
                <option value="size-80-80">80mm x 80mm</option>
            </select>
        </div>
        <div style="flex:1">
            <label>码制类型</label>
            <select id="code-type">
                <option value="BARCODE">条形码</option>
                <option value="QRCODE">二维码</option>
            </select>
        </div>
    </div>
    
    <div style="display:flex; gap:10px;">
        <div style="flex:1.5"><label>单号前缀</label><input type="text" id="prefix" value="HCN"></div>
        <div style="flex:1"><label>总件数</label><input type="number" id="qty" value=" " min="1"></div>
    </div>
    
    <div class="btn-group">
        <button class="btn-main" style="background:#4a90e2" onclick="handleGenerate()">1. 预览标签</button>
        <button class="btn-main" style="background:#6c5ce7" onclick="copyInfo()">2. 复制信息</button>
        <button class="btn-main" style="background:#28a745" id="btn-share" onclick="handleExportPDF()">3. 分享 PDF</button>
        <button class="btn-main" style="background:#f39c12" onclick="handleExportCSV()">4. 导出 CSV</button>
    </div>

    <div class="copyright-info">
        <div style="font-weight:bold; color: #000;">© HCN Supply Chain (Shenzhen) Co., Ltd.</div>
        <div style="color: #444;">日本跨境物流联系📞 Joyhua 19867541192</div>
    </div>
</div>

<div id="container"></div>
<div id="toast" class="toast">操作成功</div>

<canvas id="temp-canvas" style="display:none;"></canvas>
<div id="qr-gen-box" style="display:none;"></div>

<script>
let lastBatchData = null;

function toggleCustomMode() {
    const isCustom = document.getElementById('mode').value === "CUSTOM";
    document.getElementById('custom-mode-input').style.display = isCustom ? "block" : "none";
}

function handleGenerate() {
    const qty = parseInt(document.getElementById('qty').value) || 1;
    const prefix = document.getElementById('prefix').value || "HCN-";
    const modeSelect = document.getElementById('mode');
    const modeText = (modeSelect.value === "CUSTOM") ? document.getElementById('custom-mode-input').value : modeSelect.options[modeSelect.selectedIndex].text;
    const sizeClass = document.getElementById('label-size').value;
    const codeType = document.getElementById('code-type').value;
    const container = document.getElementById('container');
    
    container.innerHTML = '';
    const now = new Date();
    const dateKey = now.toISOString().slice(2,10).replace(/-/g,'');
    const randomSuffix = Math.floor(Math.random() * 900 + 100);
    const mainTracking = `${prefix}${dateKey}${randomSuffix}`;

    lastBatchData = { 
        mode: modeText, mainTracking: mainTracking, total: qty, 
        date: now.toLocaleDateString(), size: sizeClass 
    };

    for(let i=1; i<=qty; i++) {
        // 关键逻辑：码内包含的信息 (格式：单号-当前件 | 当前件/总数)
        // 例如：HCN-251230123-1 | 1/10
        const displayLabel = `${i} / ${qty}`;
        const trackingWithCounter = `${mainTracking}-${i}`;
        const codeContent = `${trackingWithCounter} | ${displayLabel}`;
        
        const wrapper = document.createElement('div');
        wrapper.className = `page-wrapper ${sizeClass}`;
        
        let codeDataUrl = '';
        if(codeType === 'BARCODE') {
            const tempCanvas = document.getElementById('temp-canvas');
            // 条形码由于长度限制，尽量精简但保留核心
            JsBarcode(tempCanvas, codeContent, { 
                format: "CODE128", 
                width: 1.8, 
                height: 70, 
                displayValue: false,
                margin: 0
            });
            codeDataUrl = tempCanvas.toDataURL('image/png');
        } else {
            const qrBox = document.getElementById('qr-gen-box');
            qrBox.innerHTML = '';
            new QRCode(qrBox, { 
                text: codeContent, 
                width: 250, 
                height: 250, 
                correctLevel: QRCode.CorrectLevel.M 
            });
            const qrCanvas = qrBox.querySelector('canvas');
            codeDataUrl = qrCanvas.toDataURL('image/png');
        }

        wrapper.innerHTML = `
            <div class="label-content">
                <div class="header-mode">${modeText}</div>
                <div style="text-align:center">
                    <div class="big-qty">${displayLabel}</div>
                    <div class="big-tracking">${trackingWithCounter}</div>
                </div>
                <div class="code-area">
                    <img src="${codeDataUrl}" class="${codeType === 'BARCODE' ? 'barcode-img' : 'qrcode-img'}">
                </div>
                <div class="footer-made">MADE IN CHINA</div>
            </div>`;
        container.appendChild(wrapper);
    }
    showToast("预览已生成");
}

function copyInfo() {
    if(!lastBatchData) return alert("请先生成预览");
    const info = `日期: ${lastBatchData.date}\n单号: ${lastBatchData.mainTracking}\n件数: ${lastBatchData.total}件\n运输: ${lastBatchData.mode}`;
    const textArea = document.createElement("textarea");
    textArea.value = info;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    showToast("信息已复制");
}

async function handleExportPDF() {
    const pages = document.querySelectorAll('.page-wrapper');
    if(pages.length === 0) return alert("请先生成预览");
    const btn = document.getElementById('btn-share');
    btn.innerText = "生成中...";

    const dimensions = {
        'size-100-100': [100, 100],
        'size-100-50': [100, 50],
        'size-80-80': [80, 80]
    }[lastBatchData.size];

    try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: dimensions, compress: true });
        for (let i = 0; i < pages.length; i++) {
            const canvas = await html2canvas(pages[i], { scale: 2, useCORS: true });
            if (i > 0) pdf.addPage(dimensions);
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, dimensions[0], dimensions[1], undefined, 'FAST');
        }
        const fileName = `${lastBatchData.mode}_${lastBatchData.mainTracking}_${lastBatchData.total}件.pdf`;
        const pdfBlob = pdf.output('blob');
        const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
            await navigator.share({ files: [pdfFile], title: 'HCN物流标签' });
        } else {
            pdf.save(fileName);
        }
    } catch (err) { alert("生成失败"); }
    finally { btn.innerText = "3. 分享 PDF"; }
}

function handleExportCSV() {
    if(!lastBatchData) return alert("请先生成预览");
    const csvContent = "\ufeff运输方式,主单号,总件数,日期\n" + 
                       `"${lastBatchData.mode}","${lastBatchData.mainTracking}",${lastBatchData.total},"${lastBatchData.date}"`;
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${lastBatchData.mode}_${lastBatchData.mainTracking}.csv`;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => { document.body.removeChild(link); window.URL.revokeObjectURL(url); }, 100);
    showToast("CSV已导出");
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
