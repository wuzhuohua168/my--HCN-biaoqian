<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物流标签-智能条码版</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    /* 核心：消除所有可能的像素溢出 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f4f7f9; }
    
    /* 预览容器样式 */
    #container { width: 100mm; margin: 0 auto; position: relative; background: #fff; }

    /* 每一个页面容器 */
    .page-wrapper {
        width: 100mm;
        height: 100mm;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 5px;
    }

    /* 导出模式下的特殊处理 */
    .export-mode .page-wrapper {
        margin-bottom: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
    }

    .label-content {
        width: 100mm;
        height: 100mm;
        padding: 4mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #f0f0f0;
    }

    .header-mode {
        width: 100%;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 4px solid #000;
        padding-bottom: 1.5mm;
    }

    .mid-info { text-align: center; width: 100%; margin: 1mm 0; }
    .big-qty { font-size: 38px; font-weight: 900; line-height: 1; }
    .big-tracking {
        font-size: 22px; font-weight: 900; font-family: monospace;
        display: block; border-top: 2px solid #000; border-bottom: 2px solid #000;
        padding: 1.5mm 0; margin: 1.5mm 0;
    }

    .barcode-area { width: 100%; height: 45mm; display: flex; align-items: center; justify-content: center; }
    .barcode-img { width: 100%; max-height: 100%; height: auto; display: block; }

    .footer-made {
        width: 100%; border: 3px solid #000; text-align: center;
        font-size: 18px; font-weight: bold; padding: 1mm;
    }

    /* 控制面板 */
    .controls { max-width: 450px; margin: 10px auto 20px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .row { margin-bottom: 10px; }
    label { font-size: 12px; font-weight: bold; color: #666; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    #custom-mode-row { display: none; margin-top: 5px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; color: #fff; cursor: pointer; }
    
    .info-tip {
        background: #e7f3ff;
        border-left: 4px solid #4a90e2;
        padding: 10px;
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        border-radius: 4px;
    }
</style>

</head>

<body>

<div class="controls no-print">
    <div class="row">
        <label>运输方式</label>
        <select id="mode" onchange="toggleCustomMode()">
            <option>大陆飞日本</option>
            <option>香港飞日本</option>
            <option>国际快递</option>
            <option>普船海运GS</option>
            <option>普船海运包税</option>
            <option>快船包税</option>
            <option>普船商业件</option>
            <option>快船商业件</option>
            <option>20呎整柜商业件</option>
            <option>40呎整柜商业件</option>
            <option value="CUSTOM">-- 手动输入自定义 --</option>
        </select>
        <div id="custom-mode-row"><input type="text" id="custom-mode-input" placeholder="输入名称"></div>
    </div>
    <div class="row">
        <div style="display:flex; gap:10px;">
            <div style="flex:1"><label>单号前缀</label><input type="text" id="prefix" value="HCN"></div>
            <div style="flex:1"><label>生成件数</label><input type="number" id="qty" value=" "></div>
        </div>
    </div>
    <div class="btn-group">
        <button style="background:#4a90e2" onclick="handleGenerate()">1. 生成预览</button>
        <button style="background:#28a745" onclick="handleExport()">2. 导出 PDF</button>
    </div>
    <div class="info-tip">
        💡 <strong>扫码提示：</strong>条形码包含单号和件数信息，扫码格式示例：<br>
        <code>HCN24122912341-1/3</code>（表示单号HCN24122912341的第1件，共3件）
    </div>
</div>

<div id="container"></div>
<canvas id="temp-canvas" style="display:none;"></canvas>

<script>
let fileNameData = { mode: "", sn: "" };

function toggleCustomMode() {
    const s = document.getElementById('mode');
    document.getElementById('custom-mode-row').style.display = (s.value === "CUSTOM") ? "block" : "none";
}

function handleGenerate() {
    const qty = parseInt(document.getElementById('qty').value) || 1;
    const prefix = document.getElementById('prefix').value || "CN";
    const modeSelect = document.getElementById('mode');
    const modeText = (modeSelect.value === "CUSTOM") ? document.getElementById('custom-mode-input').value : modeSelect.options[modeSelect.selectedIndex].text;
    
    const container = document.getElementById('container');
    container.classList.remove('export-mode');
    container.innerHTML = '';
    
    const dateStr = new Date().toISOString().slice(2,10).replace(/-/g,'');
    const randomSuffix = Math.floor(Math.random() * 9000 + 1000);
    
    fileNameData.mode = modeText;
    fileNameData.sn = `${prefix}${dateStr}${randomSuffix}1`;

    for(let i=1; i<=qty; i++) {
        const tracking = `${prefix}${dateStr}${randomSuffix}${i}`;
        
        // 🔑 核心修改：条形码仅包含单号和件数信息
        // 格式：单号-序号/总数
        const barcodeData = `${tracking}-${i}/${qty}`;
        
        const tempCanvas = document.getElementById('temp-canvas');
        
        // 使用CODE128编码，设置最大尺寸以便扫码枪识别
        JsBarcode(tempCanvas, barcodeData, { 
            format: "CODE128", 
            width: 3.5,        // 大幅增加条宽
            height: 150,       // 大幅增加条高
            displayValue: false, 
            margin: 10         // 增加边距防止截断
        });
        
        const imgData = tempCanvas.toDataURL("image/jpeg", 1.0);

        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.innerHTML = `
            <div class="label-content">
                <div class="header-mode">${modeText}</div>
                <div class="mid-info">
                    <div class="big-qty">${i} / ${qty}</div>
                    <span class="big-tracking">${tracking}</span>
                </div>
                <div class="barcode-area"><img src="${imgData}" class="barcode-img"></div>
                <div class="footer-made">MADE IN CHINA</div>
            </div>
        `;
        container.appendChild(wrapper);
    }
}

async function handleExport() {
    const container = document.getElementById('container');
    if(!container.hasChildNodes()) return alert("请先生成预览");

    container.classList.add('export-mode');
    window.scrollTo(0, 0);

    const name = `${fileNameData.mode}_${fileNameData.sn}.pdf`;
    const pages = container.querySelectorAll('.page-wrapper');
    
    try {
        const { jsPDF } = window.jspdf || { jsPDF: null };
        const pdf = new jsPDF({ unit: 'mm', format: [100, 100], orientation: 'portrait' });
        
        for (let i = 0; i < pages.length; i++) {
            const page = pages[i];
            
            const canvas = await html2canvas(page, {
                scale: 3,
                useCORS: true,
                backgroundColor: '#ffffff',
                width: page.offsetWidth,
                height: page.offsetHeight,
                windowWidth: page.offsetWidth,
                windowHeight: page.offsetHeight,
                x: 0,
                y: 0
            });
            
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            
            if (i > 0) pdf.addPage();
            pdf.addImage(imgData, 'JPEG', 0, 0, 100, 100);
        }
        
        const pdfBlob = pdf.output('blob');
        const file = new File([pdfBlob], name, { type: 'application/pdf' });

        if (navigator.share && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: '分享物流标签' });
        } else {
            pdf.save(name);
        }
    } catch (err) {
        console.error(err);
        alert("导出失败：" + err.message);
    } finally {
        container.classList.remove('export-mode');
    }
}
</script>

</body>
</html>
